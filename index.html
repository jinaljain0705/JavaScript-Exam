<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Product Page</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-b from-gray-100 to-white min-h-screen text-slate-900 antialiased p-7">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center flex-wrap gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">Product Page</h1>
                <p class="text-sm text-slate-500 mt-1">Create, read, update, and delete products. Data stored locally (LocalStorage).</p>
            </div>
        </header>

        <!-- Add Product Form -->
        <section class="bg-white rounded-xl shadow p-5 mb-5">
            <form id="addForm" class="flex flex-wrap gap-3 items-center">
                <div class="flex flex-wrap gap-3 flex-1">
                    <input id="title" type="text" placeholder="Product title" class="border border-gray-200 rounded-md px-3 py-2 flex-1 min-w-[150px] outline-none focus:ring-2 focus:ring-blue-500" />
                    <input id="price" type="number" placeholder="Price (₹)" min="0" class="border border-gray-200 rounded-md px-3 py-2 w-36 outline-none focus:ring-2 focus:ring-blue-500" />
                    <input id="image" type="text" placeholder="Image URL (optional)" class="border border-gray-200 rounded-md px-3 py-2 flex-1 outline-none focus:ring-2 focus:ring-blue-500" />
                    <input id="category" type="text" placeholder="Category (optional)" class="border border-gray-200 rounded-md px-3 py-2 w-40 outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="flex items-center gap-2">
                    <button type="submit" class="bg-blue-600 text-white font-medium px-4 py-2 rounded-md shadow hover:bg-blue-700 transition">Add
                        Product</button>
                    <button id="clearBtn" type="button" class="border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition">Clear</button>
                </div>
            </form>
        </section>

        <!-- Controls -->
        <section class="flex flex-wrap gap-3 items-center mb-5">
            <input id="search" type="search" placeholder="Search by title..." class="border border-gray-200 rounded-md px-3 py-2 w-56 outline-none focus:ring-2 focus:ring-blue-500" />
            <select id="filterCategory" title="Filter by category" class="border border-gray-200 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All categories</option>
            </select>
            <select id="sortPrice" title="Sort by price" class="border border-gray-200 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Sort by price</option>
                <option value="low">Price: Low → High</option>
                <option value="high">Price: High → Low</option>
            </select>
            <div class="ml-auto flex gap-2 items-center">
                <button id="seedBtn" class="border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition">Seed demo</button>
                <button id="clearAll" class="border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition">Clear all</button>
            </div>
        </section>

        <!-- Products Grid -->
        <main id="listWrap">
            <div id="grid" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="backdrop" class="fixed inset-0 hidden bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-lg w-[90%] max-w-md p-6 shadow-2xl">
            <h3 class="text-lg font-semibold mb-3">Edit Product</h3>
            <form id="editForm" class="space-y-3">
                <input id="editTitle" type="text" placeholder="Product title" class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" />
                <div class="flex gap-3">
                    <input id="editPrice" type="number" placeholder="Price" class="flex-1 border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" />
                    <input id="editCategory" type="text" placeholder="Category" class="flex-1 border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <input id="editImage" type="text" placeholder="Image URL" class=" border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" />
                <div class="flex justify-end gap-2 pt-2">
                    <button id="cancelEdit" type="button" class="border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition">Cancel</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
